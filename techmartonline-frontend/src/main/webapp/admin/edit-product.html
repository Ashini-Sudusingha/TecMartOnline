    <link rel="stylesheet" href="../css/style.css" />

            display: block !important;
            background-color: #f8fafc;
        }
    </style>
</head>

            <div>
                <h2 class="font-black text-lg leading-tight tracking-wide">TechMart</h2>
                <span class="text-[10px] text-amber-400 font-bold uppercase tracking-wider">Admin Panel</span>
            </div>
        </div>
                <!-- Nav Links -->
        <nav class="px-4 py-6 space-y-1.5">
            <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-slate-100 hover:bg-slate-800 font-semibold transition-all duration-200">
                <span class="text-lg">📊</span> Dashboard
            </a>
            <a href="products.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-950 bg-amber-400 font-bold transition-all duration-200 shadow-lg shadow-amber-400/10">
                <span class="text-lg">📦</span> Products
            </a>
            <a href="orders.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-slate-100 hover:bg-slate-800 font-semibold transition-all duration-200">
                <span class="text-lg">📋</span> Orders
            </a>
            <a href="users.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-slate-100 hover:bg-slate-800 font-semibold transition-all duration-200">
                <span class="text-lg">👥</span> Users
            </a>
            <a href="inventory.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-slate-100 hover:bg-slate-800 font-semibold transition-all duration-200">
                <span class="text-lg">📈</span> Inventory
            </a>
            <a href="warehouses.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-slate-100 hover:bg-slate-800 font-semibold transition-all duration-200">
                <span class="text-lg">🏢</span> Warehouses
            </a>
            <a href="suppliers.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-slate-100 hover:bg-slate-800 font-semibold transition-all duration-200">
                <span class="text-lg">🏭</span> Suppliers
            </a>
            <a href="invoices.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-slate-100 hover:bg-slate-800 font-semibold transition-all duration-200">
                <span class="text-lg">🧾</span> Invoices
            </a>
            <a href="reports.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-slate-100 hover:bg-slate-800 font-semibold transition-all duration-200">
                <span class="text-lg">📊</span> Reports
            </a>
        </nav>
    </div>
    <!-- Profile & Logout -->
    <div class="p-4 border-t border-slate-800 bg-slate-950/40">
        <div class="flex items-center gap-3 px-2 py-2 mb-3">
            <div class="w-10 h-10 rounded-xl bg-amber-400 text-slate-950 flex items-center justify-center font-bold">A</div>
            <div>
                <h4 class="font-bold text-sm text-slate-100">Administrator</h4>
                <p class="text-[11px] text-slate-500 font-semibold">admin@techmart.com</p>
            </div>
        </div>
        <a href="../index.html" class="flex items-center justify-center gap-2 w-full py-2.5 rounded-xl bg-rose-500/10 hover:bg-rose-500 text-rose-500 hover:text-white text-sm font-bold transition-all duration-200 border border-rose-500/20">
            <span>🚪</span> Log Out
        </a>
    </div>
</aside>

<!-- Sidebar Overlay for Mobile -->
<div id="sidebar-overlay" class="fixed inset-0 z-40 bg-slate-950/50 hidden transition-opacity duration-300 lg:hidden"></div>

<!-- Content Wrapper -->
<div class="lg:pl-64 min-h-screen bg-slate-50 flex flex-col">
    <!-- Top Header -->
    <header class="sticky top-0 z-30 h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-4">
            <!-- Mobile Menu Button -->
            <button id="menu-btn" class="lg:hidden p-2 rounded-xl text-slate-600 hover:bg-slate-100 transition-all">
                <span class="text-xl">☰</span>
            </button>
            <h1 class="text-base font-bold text-slate-800 hidden sm:block">Edit Product Entry</h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="products.html" class="flex items-center gap-2 px-4 py-2 rounded-xl border-2 border-slate-200 hover:border-slate-800 hover:bg-slate-50 text-slate-700 hover:text-slate-900 font-bold transition-all duration-200 text-sm">
                ← Back to Products
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6 space-y-6 max-w-4xl">
        <!-- Page Title & Subtitle -->
        <div class="flex flex-col gap-1">
            <h2 class="text-2xl font-black text-slate-900 tracking-tight">✏️ Edit Product</h2>
            <p class="text-sm text-slate-500 font-medium">Update the details of the catalog product.</p>
        </div>

        <!-- Form Card -->
        <form id="editProductForm" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-6">
            <input type="hidden" id="productId" />

            <!-- Form Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Left Column -->
                <div class="space-y-5">
                    <div class="space-y-1.5">
                        <label for="productName" class="text-xs font-bold text-slate-500 uppercase tracking-wider">Product Name *</label>
                        <input type="text" id="productName" placeholder="e.g. MacBook Pro M3" class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 focus:border-amber-400 focus:outline-none text-sm font-medium transition-all bg-slate-50/50 focus:bg-white" required />
                    </div>
                    <div class="space-y-1.5">
                        <label for="productDescription" class="text-xs font-bold text-slate-500 uppercase tracking-wider">Description *</label>
                        <textarea id="productDescription" rows="4" placeholder="Enter high-level description of the features..." class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 focus:border-amber-400 focus:outline-none text-sm font-medium transition-all bg-slate-50/50 focus:bg-white resize-none" required></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label for="productPrice" class="text-xs font-bold text-slate-500 uppercase tracking-wider">Price ($) *</label>
                            <input type="number" id="productPrice" placeholder="0.00" step="0.01" class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 focus:border-amber-400 focus:outline-none text-sm font-medium transition-all bg-slate-50/50 focus:bg-white" required />
                        </div>
                        <div class="space-y-1.5">
                            <label for="productStock" class="text-xs font-bold text-slate-500 uppercase tracking-wider">Stock Qty *</label>
                            <input type="number" id="productStock" placeholder="0" class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 focus:border-amber-400 focus:outline-none text-sm font-medium transition-all bg-slate-50/50 focus:bg-white" required />
                        </div>
                    </div>
                </div>

                <!-- Right Column -->
                <div class="space-y-5">
                    <div class="space-y-1.5">
                        <label for="productCategory" class="text-xs font-bold text-slate-500 uppercase tracking-wider">Category *</label>
                        <select id="productCategory" class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 focus:border-amber-400 focus:outline-none text-sm font-bold bg-white text-slate-700 cursor-pointer transition-all" required>
                            <option value="">Select Category</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Audio">Audio</option>
                            <option value="Accessories">Accessories</option>
                            <option value="Furniture">Furniture</option>
                            <option value="Clothing">Clothing</option>
                        </select>
                    </div>
                    <div class="space-y-1.5">
                        <label for="productBrand" class="text-xs font-bold text-slate-500 uppercase tracking-wider">Brand *</label>
                        <input type="text" id="productBrand" placeholder="e.g. Apple" class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 focus:border-amber-400 focus:outline-none text-sm font-medium transition-all bg-slate-50/50 focus:bg-white" required />
                    </div>
                    <div class="space-y-1.5">
                        <label for="productImage" class="text-xs font-bold text-slate-500 uppercase tracking-wider">Image / Emoji Icon</label>
                        <input type="text" id="productImage" placeholder="e.g. 💻 or image url" class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 focus:border-amber-400 focus:outline-none text-sm font-medium transition-all bg-slate-50/50 focus:bg-white" />
                    </div>
                    <div class="space-y-1.5">
                        <label for="productBarcode" class="text-xs font-bold text-slate-500 uppercase tracking-wider">Barcode</label>
                        <input type="text" id="productBarcode" placeholder="e.g. UPC / EAN code" class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 focus:border-amber-400 focus:outline-none text-sm font-medium transition-all bg-slate-50/50 focus:bg-white" />
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center justify-end gap-3 pt-6 border-t border-slate-100">
                <button type="button" onclick="window.location.href='products.html'" class="px-6 py-2.5 rounded-xl border-2 border-slate-200 hover:border-slate-800 hover:bg-slate-50 text-slate-700 hover:text-slate-900 font-bold transition-all text-sm">
                    Cancel
                </button>
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-500 text-slate-950 font-bold transition-all shadow-lg shadow-amber-400/10 text-sm">
                    💾 Update Product
                </button>
            </div>
        </form>
    </main>
</div>

<!-- Scripts -->
<script src="../js/api/config.js"></script>
<script src="../js/utils/auth.js"></script>
<script>
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    if (menuBtn && sidebar && overlay) {
        menuBtn.addEventListener('click', () => {
            sidebar.classList.remove('-translate-x-full');
            overlay.classList.remove('hidden');
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        });
    }

    // Set Admin details on load
    document.addEventListener('DOMContentLoaded', () => {
        if (!AuthUtils.checkAuth('ADMIN')) return;
        const user = AuthUtils.getUser();
        if (user) {
            const adminName = document.getElementById('adminName');
            if (adminName) adminName.textContent = `${user.firstName} ${user.lastName}`;
        }
    });
</script>
<script>
    // Load product data from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    if (productId) {
        document.getElementById('productId').value = productId;
        loadProductData(productId);
    }

    function loadProductData(id) {
        const products = JSON.parse(localStorage.getItem('adminProducts') || '[]');
        const product = products.find(p => p.id == id);

        if (product) {
            document.getElementById('productName').value = product.name || '';
            document.getElementById('productDescription').value = product.description || '';
            document.getElementById('productPrice').value = product.price || '';
            document.getElementById('productStock').value = product.stock || '';
            document.getElementById('productCategory').value = product.category || '';
            document.getElementById('productBrand').value = product.brand || '';
            document.getElementById('productImage').value = product.image || '';
            document.getElementById('productBarcode').value = product.barcode || '';
        }
    }

    document.getElementById('editProductForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const id = document.getElementById('productId').value;
        let products = JSON.parse(localStorage.getItem('adminProducts') || '[]');
        const index = products.findIndex(p => p.id == id);

        if (index !== -1) {
            products[index] = {
                id: parseInt(id),
                name: document.getElementById('productName').value,
                description: document.getElementById('productDescription').value,
                price: parseFloat(document.getElementById('productPrice').value),
                stock: parseInt(document.getElementById('productStock').value),
                category: document.getElementById('productCategory').value,
                brand: document.getElementById('productBrand').value,
                image: document.getElementById('productImage').value || '📦',
                barcode: document.getElementById('productBarcode').value,
                status: products[index].status || 'active'
            };
            localStorage.setItem('adminProducts', JSON.stringify(products));
            alert('✅ Product updated successfully!');
            window.location.href = 'products.html';
        }
    });
</script>

</body>
</html>
