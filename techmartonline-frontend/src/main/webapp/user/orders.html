<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders - TechMart Online</title>
    <link rel="stylesheet" href="../css/tailwind.css" />
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
        body {
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="font-['Urbanist'] text-slate-800 bg-slate-50 antialiased min-h-screen flex flex-col justify-between">

<!-- Header Navigation -->
<nav class="bg-white border-b border-slate-100 sticky top-0 z-50 py-4 shadow-sm">
    <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
        <a href="../index.html" class="flex items-center gap-2 font-black text-2xl text-slate-900">
            <span class="bg-amber-400 text-slate-950 p-2 rounded-xl text-lg font-bold">🛒</span>
            TechMart
        </a>
        <div class="flex items-center gap-6 font-semibold text-sm">
            <a href="products.html" class="text-slate-600 hover:text-slate-900 transition-colors">Products</a>
            <a href="cart.html" class="text-slate-600 hover:text-slate-900 transition-colors">Cart</a>
            <a href="orders.html" class="text-amber-500 font-bold">Orders</a>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="logout()" class="px-4 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition-all cursor-pointer">Logout</button>
        </div>
    </div>
</nav>

<!-- Main Container -->
<main class="max-w-6xl mx-auto px-6 py-12 flex-grow w-full">
    <h1 class="text-3xl font-black tracking-tight text-slate-900 mb-8">My Orders</h1>

    <div class="space-y-6">
        <div id="ordersList" class="space-y-4">
            <!-- Orders dynamically rendered here -->
            <div id="loadingMessage" class="text-center py-12">
                <span class="text-slate-400 font-semibold text-sm">Loading your orders...</span>
            </div>
        </div>

        <div id="emptyOrdersMessage" class="hidden text-center py-16 bg-white rounded-3xl border border-slate-100 shadow-sm">
            <span class="text-6xl block mb-4">📦</span>
            <h3 class="text-xl font-bold text-slate-700 mb-2">No Orders Yet</h3>
            <p class="text-slate-400 mb-6 text-sm">You haven't placed any orders with TechMart Online yet.</p>
            <a href="products.html" class="inline-flex px-6 py-3 bg-amber-400 hover:bg-amber-500 text-slate-950 font-bold rounded-xl shadow-md transition-all text-sm">
                Shop Now
            </a>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 w-full mt-auto">
    <div class="max-w-6xl mx-auto px-6 text-center text-xs font-semibold">
        © 2026 TechMart Online. All rights reserved.
    </div>
</footer>

<script>
    const API_BASE = 'http://localhost:8080/tecmartonline-sever/api';

    async function loadOrders() {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '../auth/login.html';
            return;
        }

        const user = JSON.parse(localStorage.getItem('user'));
        const list = document.getElementById('ordersList');
        const emptyMsg = document.getElementById('emptyOrdersMessage');
        const loading = document.getElementById('loadingMessage');

        try {
            const response = await fetch(`${API_BASE}/orders/user/${user.id}`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) throw new Error('Failed to load orders.');

            const result = await response.json();
            loading.classList.add('hidden');

            const orders = result.data || [];

            if (orders.length === 0) {
                emptyMsg.classList.remove('hidden');
                list.innerHTML = '';
                return;
            }

            emptyMsg.classList.add('hidden');

            list.innerHTML = orders.map(order => {
                const dateStr = new Date(order.createdAt).toLocaleDateString(undefined, {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                // Status Badge Color
                let statusClass = 'bg-slate-100 text-slate-700 border border-slate-200';
                if (order.status.toLowerCase() === 'delivered') {
                    statusClass = 'bg-emerald-50 text-emerald-700 border border-emerald-200';
                } else if (order.status.toLowerCase() === 'processing') {
                    statusClass = 'bg-amber-50 text-amber-700 border border-amber-200';
                } else if (order.status.toLowerCase() === 'cancelled') {
                    statusClass = 'bg-rose-50 text-rose-700 border border-rose-200';
                }

                // Payment Status Color
                let payClass = 'bg-slate-100 text-slate-700 border border-slate-200';
                if (order.paymentStatus.toLowerCase() === 'paid') {
                    payClass = 'bg-emerald-50 text-emerald-700 border border-emerald-200';
                } else if (order.paymentStatus.toLowerCase() === 'pending') {
                    payClass = 'bg-amber-50 text-amber-700 border border-amber-200';
                }

                return `
                    <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4 hover:border-slate-200 transition-all">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 pb-4">
                            <div>
                                <span class="text-xs text-slate-400 font-bold block uppercase tracking-wider">Order ID</span>
                                <span class="font-bold text-slate-900">#${order.id}</span>
                            </div>
                            <div>
                                <span class="text-xs text-slate-400 font-bold block uppercase tracking-wider">Date</span>
                                <span class="font-semibold text-slate-700 text-sm">${dateStr}</span>
                            </div>
                            <div class="flex gap-2">
                                <div>
                                    <span class="text-xs text-slate-400 font-bold block uppercase tracking-wider mb-1">Status</span>
                                    <span class="inline-flex px-2.5 py-0.5 text-xs font-black rounded-lg ${statusClass}">${order.status}</span>
                                </div>
                                <div>
                                    <span class="text-xs text-slate-400 font-bold block uppercase tracking-wider mb-1">Payment</span>
                                    <span class="inline-flex px-2.5 py-0.5 text-xs font-black rounded-lg ${payClass}">${order.paymentStatus}</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex justify-between items-center text-sm">
                            <div class="text-slate-500 font-semibold">
                                <span>Payment Method: </span>
                                <span class="text-slate-900 font-bold">${order.paymentMethod}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-xs text-slate-400 font-semibold block">Total Paid</span>
                                <span class="font-black text-slate-900 text-lg">$${order.totalAmount.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

        } catch (error) {
            loading.classList.add('hidden');
            list.innerHTML = `
                <div class="text-center py-12 bg-rose-50 text-rose-700 rounded-3xl border border-rose-100">
                    <span class="font-bold">❌ Error loading orders. Please try again.</span>
                </div>
            `;
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = '../auth/login.html';
    }

    document.addEventListener('DOMContentLoaded', loadOrders);
</script>

</body>
</html>
