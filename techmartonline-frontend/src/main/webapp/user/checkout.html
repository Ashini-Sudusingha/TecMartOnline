<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - TechMart Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: "Plus Jakarta Sans", sans-serif !important;
            background-color: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 antialiased custom-scrollbar min-h-screen flex flex-col justify-between">

<!-- Header Navigation -->
<nav class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50 py-4 shadow-sm">
    <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
        <!-- Logo -->
        <a href="../index.html" class="flex items-center gap-3 font-extrabold text-xl text-slate-900 tracking-tight">
            <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-amber-400 to-amber-300 text-slate-950 flex items-center justify-center font-bold text-lg shadow-md shadow-amber-500/10">
                <svg class="w-5 h-5 text-slate-950" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1,0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0,1-1.12-1.243l1.264-12A1.125 1.125 0 0,1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1,1-.75 0 .375.375 0 0,1 .75 0Zm7.5 0a.375.375 0 1,1-.75 0 .375.375 0 0,1 .75 0Z" />
                </svg>
            </div>
            TechMart
        </a>

        <!-- Navigation Links -->
        <div class="hidden md:flex items-center gap-8 font-semibold text-sm">
            <a href="products.html" class="text-slate-600 hover:text-slate-955 transition-colors">Shop Products</a>
            <a href="cart.html" class="text-slate-600 hover:text-slate-955 transition-colors flex items-center gap-1.5">
                Cart
                <span id="cartCountBadgeMenu" class="hidden px-2 py-0.5 text-[10px] font-bold rounded-full bg-amber-400 text-slate-950">0</span>
            </a>
            <a href="profile.html" class="text-slate-600 hover:text-slate-955 transition-colors">My Profile</a>
        </div>

        <!-- Logout Action -->
        <div class="flex items-center gap-3">
            <button onclick="AuthUtils.logout()" class="px-4 py-2 text-xs font-bold text-slate-700 bg-slate-50 hover:bg-slate-100 rounded-xl transition-all border border-slate-200/60 cursor-pointer">
                Logout
            </button>
        </div>
    </div>
</nav>

<!-- Main Container -->
<main class="max-w-6xl mx-auto px-6 py-12 flex-grow w-full">
    <h1 class="text-3xl font-black tracking-tight text-slate-900 mb-8">Checkout</h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Billing / Shipping Details -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-6">
                <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3">Shipping Address</h2>
                
                <form id="checkoutForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-bold text-slate-400 uppercase">First Name</label>
                            <input type="text" id="fname" class="px-4 py-3 bg-slate-50 border border-slate-150 rounded-xl font-semibold text-sm focus:outline-none focus:border-amber-400 text-slate-500" readonly />
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-bold text-slate-400 uppercase">Last Name</label>
                            <input type="text" id="lname" class="px-4 py-3 bg-slate-50 border border-slate-150 rounded-xl font-semibold text-sm focus:outline-none focus:border-amber-400 text-slate-500" readonly />
                        </div>
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-bold text-slate-400 uppercase">Select Shipping Address *</label>
                        <select id="checkoutAddress" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-sm focus:outline-none focus:border-amber-400 bg-white cursor-pointer" required>
                            <option value="">Select Shipping Address</option>
                        </select>
                        <p class="text-[10px] text-slate-400 font-semibold mt-1">Don't see your address? Add one in <a href="profile.html" class="text-amber-500 font-bold hover:underline">My Profile</a> first.</p>
                    </div>
                </form>
            </div>

            <!-- Payment Methods -->
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3">Payment Method</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <label class="border-2 border-amber-400 bg-amber-50/20 p-4 rounded-2xl flex items-center gap-3 cursor-pointer">
                        <input type="radio" name="paymentMethod" value="1" checked class="accent-amber-500" />
                        <div>
                            <span class="font-bold block text-slate-900">Cash on Delivery</span>
                            <span class="text-xs text-slate-400 font-semibold">Pay cash when package arrives</span>
                        </div>
                    </label>
                    
                    <label class="border border-slate-100 hover:border-slate-200 p-4 rounded-2xl flex items-center gap-3 cursor-pointer">
                        <input type="radio" name="paymentMethod" value="2" class="accent-amber-500" />
                        <div>
                            <span class="font-bold block text-slate-900">Credit Card</span>
                            <span class="text-xs text-slate-400 font-semibold">Pay online securely</span>
                        </div>
                    </label>
                </div>
            </div>
        </div>

        <!-- Order Summary & Finish -->
        <div class="lg:col-span-1">
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm sticky top-24 space-y-6">
                <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3">Checkout Details</h2>
                
                <div id="checkoutSummaryList" class="space-y-3 max-h-48 overflow-y-auto pr-2">
                    <!-- Items summaries -->
                </div>

                <div class="space-y-3 text-sm border-t border-slate-100 pt-4">
                    <div class="flex justify-between text-slate-500 font-semibold">
                        <span>Subtotal</span>
                        <span id="summarySubtotal">Rs. 0.00</span>
                    </div>
                    <div class="flex justify-between text-slate-500 font-semibold">
                        <span>Shipping Cost</span>
                        <span>Rs. 10.00</span>
                    </div>
                    <div class="border-t border-slate-100 pt-3 flex justify-between font-black text-slate-900 text-lg">
                        <span>Total</span>
                        <span id="summaryTotal">Rs. 0.00</span>
                    </div>
                </div>

                <div id="statusMessage" class="hidden text-sm font-bold text-center p-3 rounded-xl"></div>

                <button id="placeOrderBtn" onclick="submitOrder()" class="w-full py-4 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm shadow-xl hover:shadow-slate-900/10 transition-all cursor-pointer">
                    Place Order →
                </button>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 w-full mt-auto">
    <div class="max-w-6xl mx-auto px-6 text-center text-xs font-semibold">
        © 2026 TechMart Online. All rights reserved.
    </div>
</footer>

<script src="../js/api/config.js"></script>
<script src="../js/utils/auth.js"></script>
<script src="../js/utils/helpers.js"></script>
<script>
    async function initCheckout() {
        if (!AuthUtils.checkAuth('CUSTOMER')) return;

        const user = AuthUtils.getUser();
        if (user) {
            document.getElementById('fname').value = user.fname || user.firstName || '';
            document.getElementById('lname').value = user.lname || user.lastName || '';
        }

        // Fetch customer addresses
        const token = AuthUtils.getToken();
        const select = document.getElementById('checkoutAddress');
        try {
            const res = await fetch(`${Config.BASE_URL}/users/${user.id}/addresses`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const json = await res.json();
                const addresses = json.data || [];
                if (addresses.length === 0) {
                    select.innerHTML = '<option value="">No addresses saved. Please add one in Profile!</option>';
                } else {
                    select.innerHTML = '<option value="">Select Shipping Address</option>' + 
                        addresses.map(addr => `<option value="${addr.id}">${addr.line1}, ${addr.line2}, ${addr.cityName} (Postal: ${addr.postalCode})</option>`).join('');
                }
            }
        } catch (err) {
            console.error("Error loading checkout addresses:", err);
        }

        // Load summary
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        if (cart.length === 0) {
            window.location.href = 'cart.html';
            return;
        }

        let subtotal = 0;
        const list = document.getElementById('checkoutSummaryList');
        
        list.innerHTML = cart.map(item => {
            const itemTotal = item.price * item.quantity;
            subtotal += itemTotal;
            return `
                <div class="flex justify-between items-center text-xs font-semibold">
                    <span class="text-slate-500">${item.name} <span class="font-bold text-slate-700">x${item.quantity}</span></span>
                    <span class="font-black text-slate-900">${Helpers.formatPrice(itemTotal)}</span>
                </div>
            `;
        }).join('');

        const total = subtotal + 10.00;
        document.getElementById('summarySubtotal').textContent = Helpers.formatPrice(subtotal);
        document.getElementById('summaryTotal').textContent = Helpers.formatPrice(total);
    }

    async function submitOrder() {
        const form = document.getElementById('checkoutForm');
        if (!form.reportValidity()) return;

        const addressSelect = document.getElementById('checkoutAddress');
        if (!addressSelect.value) {
            alert("❌ Please select a shipping address!");
            return;
        }

        const placeOrderBtn = document.getElementById('placeOrderBtn');
        const statusMsg = document.getElementById('statusMessage');

        placeOrderBtn.disabled = true;
        placeOrderBtn.textContent = 'Processing checkout...';

        statusMsg.classList.add('hidden');

        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        let subtotal = 0;
        cart.forEach(item => subtotal += item.price * item.quantity);
        const total = subtotal + 10.00;

        const user = AuthUtils.getUser();
        const paymentMethodId = parseInt(document.querySelector('input[name="paymentMethod"]:checked').value);

        const orderRequest = {
            userId: user.id,
            addressId: parseInt(addressSelect.value),
            paymentMethodId: paymentMethodId,
            subtotal: subtotal,
            total: total,
            items: cart.map(item => ({
                productId: item.id,
                quantity: item.quantity,
                price: item.price
            }))
        };

        const token = AuthUtils.getToken();

        try {
            const response = await fetch(`${Config.BASE_URL}/orders`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(orderRequest)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || 'Checkout failed');
            }

            // Success
            statusMsg.className = 'text-sm font-bold text-center p-3 rounded-xl bg-emerald-50 text-emerald-700';
            statusMsg.innerHTML = '✅ Order placed successfully! Redirecting...';
            statusMsg.classList.remove('hidden');

            // Clear Cart
            localStorage.removeItem('cart');

            setTimeout(() => {
                window.location.href = 'profile.html';
            }, 1500);

        } catch (error) {
            statusMsg.className = 'text-sm font-bold text-center p-3 rounded-xl bg-rose-50 text-rose-700';
            statusMsg.innerHTML = `❌ ${error.message || 'Failed to place order.'}`;
            statusMsg.classList.remove('hidden');

            placeOrderBtn.disabled = false;
            placeOrderBtn.textContent = 'Place Order →';
        }
    }

    function updateCartBadge() {
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const total = cart.reduce((sum, item) => sum + item.quantity, 0);
        const badge = document.getElementById('cartCountBadgeMenu');
        if (badge) {
            if (total > 0) {
                badge.textContent = total;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        initCheckout();
        updateCartBadge();
    });
</script>
<script src="../js/pages/chat-widget.js"></script>
</body>
</html>
