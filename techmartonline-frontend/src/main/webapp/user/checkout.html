<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - TechMart Online</title>
    <link rel="stylesheet" href="../css/tailwind.css" />
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
        body {
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="font-['Urbanist'] text-slate-800 bg-slate-50 antialiased min-h-screen flex flex-col justify-between">

<!-- Header Navigation -->
<nav class="bg-white border-b border-slate-100 sticky top-0 z-50 py-4 shadow-sm">
    <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
        <a href="../index.html" class="flex items-center gap-2 font-black text-2xl text-slate-900">
            <span class="bg-amber-400 text-slate-950 p-2 rounded-xl text-lg font-bold">🛒</span>
            TechMart
        </a>
        <div class="flex items-center gap-6 font-semibold text-sm">
            <a href="products.html" class="text-slate-600 hover:text-slate-900 transition-colors">Products</a>
            <a href="cart.html" class="text-slate-600 hover:text-slate-900 transition-colors">Cart</a>
            <a href="orders.html" class="text-slate-600 hover:text-slate-900 transition-colors">Orders</a>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="logout()" class="px-4 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition-all cursor-pointer">Logout</button>
        </div>
    </div>
</nav>

<!-- Main Container -->
<main class="max-w-6xl mx-auto px-6 py-12 flex-grow w-full">
    <h1 class="text-3xl font-black tracking-tight text-slate-900 mb-8">Checkout Checkout</h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Billing / Shipping Details -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-6">
                <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3">Shipping Address</h2>
                
                <form id="checkoutForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-bold text-slate-400 uppercase">First Name</label>
                            <input type="text" id="fname" class="px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl font-semibold text-sm focus:outline-none focus:border-amber-400" required />
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-bold text-slate-400 uppercase">Last Name</label>
                            <input type="text" id="lname" class="px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl font-semibold text-sm focus:outline-none focus:border-amber-400" required />
                        </div>
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-bold text-slate-400 uppercase">Street Address</label>
                        <input type="text" id="address" class="px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl font-semibold text-sm focus:outline-none focus:border-amber-400" placeholder="House number and street name" required />
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-bold text-slate-400 uppercase">City</label>
                            <input type="text" id="city" class="px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl font-semibold text-sm focus:outline-none focus:border-amber-400" required />
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-bold text-slate-400 uppercase">District</label>
                            <input type="text" id="district" class="px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl font-semibold text-sm focus:outline-none focus:border-amber-400" required />
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-bold text-slate-400 uppercase">Phone Number</label>
                            <input type="text" id="phone" class="px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl font-semibold text-sm focus:outline-none focus:border-amber-400" required />
                        </div>
                    </div>
                </form>
            </div>

            <!-- Payment Methods -->
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3">Payment Method</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <label class="border-2 border-amber-400 bg-amber-50/20 p-4 rounded-2xl flex items-center gap-3 cursor-pointer">
                        <input type="radio" name="paymentMethod" value="1" checked class="accent-amber-500" />
                        <div>
                            <span class="font-bold block text-slate-900">Cash on Delivery</span>
                            <span class="text-xs text-slate-400 font-semibold">Pay cash when package arrives</span>
                        </div>
                    </label>
                    
                    <label class="border border-slate-100 hover:border-slate-200 p-4 rounded-2xl flex items-center gap-3 cursor-pointer">
                        <input type="radio" name="paymentMethod" value="2" class="accent-amber-500" />
                        <div>
                            <span class="font-bold block text-slate-900">Credit Card</span>
                            <span class="text-xs text-slate-400 font-semibold">Pay online securely</span>
                        </div>
                    </label>
                </div>
            </div>
        </div>

        <!-- Order Summary & Finish -->
        <div class="lg:col-span-1">
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm sticky top-24 space-y-6">
                <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3">Checkout Details</h2>
                
                <div id="checkoutSummaryList" class="space-y-3 max-h-48 overflow-y-auto pr-2">
                    <!-- Items summaries -->
                </div>

                <div class="space-y-3 text-sm border-t border-slate-100 pt-4">
                    <div class="flex justify-between text-slate-500 font-semibold">
                        <span>Subtotal</span>
                        <span id="summarySubtotal">$0.00</span>
                    </div>
                    <div class="flex justify-between text-slate-500 font-semibold">
                        <span>Shipping Cost</span>
                        <span>$10.00</span>
                    </div>
                    <div class="border-t border-slate-100 pt-3 flex justify-between font-black text-slate-900 text-lg">
                        <span>Total</span>
                        <span id="summaryTotal">$0.00</span>
                    </div>
                </div>

                <div id="statusMessage" class="hidden text-sm font-bold text-center p-3 rounded-xl"></div>

                <button id="placeOrderBtn" onclick="submitOrder()" class="w-full py-4 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm shadow-xl hover:shadow-slate-900/10 transition-all cursor-pointer">
                    Place Order →
                </button>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 w-full mt-auto">
    <div class="max-w-6xl mx-auto px-6 text-center text-xs font-semibold">
        © 2026 TechMart Online. All rights reserved.
    </div>
</footer>

<script>
    // Config
    const API_BASE = 'http://localhost:8080/tecmartonline-sever/api';

    function initCheckout() {
        // Enforce Login
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '../auth/login.html';
            return;
        }

        // Fill customer profile
        const userStr = localStorage.getItem('user');
        if (userStr) {
            const user = JSON.parse(userStr);
            document.getElementById('fname').value = user.firstName || '';
            document.getElementById('lname').value = user.lastName || '';
            document.getElementById('phone').value = user.mobile || '';
        }

        // Load summary
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        if (cart.length === 0) {
            window.location.href = 'cart.html';
            return;
        }

        let subtotal = 0;
        const list = document.getElementById('checkoutSummaryList');
        
        list.innerHTML = cart.map(item => {
            const itemTotal = item.price * item.quantity;
            subtotal += itemTotal;
            return `
                <div class="flex justify-between items-center text-xs font-semibold">
                    <span class="text-slate-500">${item.name} <span class="font-bold text-slate-700">x${item.quantity}</span></span>
                    <span class="font-black text-slate-900">$${itemTotal.toFixed(2)}</span>
                </div>
            `;
        }).join('');

        const total = subtotal + 10.00;
        document.getElementById('summarySubtotal').textContent = `$${subtotal.toFixed(2)}`;
        document.getElementById('summaryTotal').textContent = `$${total.toFixed(2)}`;
    }

    async function submitOrder() {
        const form = document.getElementById('checkoutForm');
        if (!form.reportValidity()) return;

        const placeOrderBtn = document.getElementById('placeOrderBtn');
        const statusMsg = document.getElementById('statusMessage');

        placeOrderBtn.disabled = true;
        placeOrderBtn.textContent = 'Processing checkout...';

        statusMsg.classList.add('hidden');

        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        let subtotal = 0;
        cart.forEach(item => subtotal += item.price * item.quantity);
        const total = subtotal + 10.00;

        const user = JSON.parse(localStorage.getItem('user'));
        const paymentMethodId = parseInt(document.querySelector('input[name="paymentMethod"]:checked').value);

        const orderRequest = {
            userId: user.id,
            addressId: 1, // dummy address
            paymentMethodId: paymentMethodId,
            subtotal: subtotal,
            total: total
        };

        const token = localStorage.getItem('token');

        try {
            const response = await fetch(`${API_BASE}/orders`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(orderRequest)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || 'Checkout failed');
            }

            // Success
            statusMsg.className = 'text-sm font-bold text-center p-3 rounded-xl bg-emerald-50 text-emerald-700';
            statusMsg.innerHTML = '✅ Order placed successfully! Redirecting...';
            statusMsg.classList.remove('hidden');

            // Clear Cart
            localStorage.removeItem('cart');

            setTimeout(() => {
                window.location.href = 'orders.html';
            }, 1500);

        } catch (error) {
            statusMsg.className = 'text-sm font-bold text-center p-3 rounded-xl bg-rose-50 text-rose-700';
            statusMsg.innerHTML = `❌ ${error.message || 'Failed to place order.'}`;
            statusMsg.classList.remove('hidden');

            placeOrderBtn.disabled = false;
            placeOrderBtn.textContent = 'Place Order →';
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = '../auth/login.html';
    }

    document.addEventListener('DOMContentLoaded', initCheckout);
</script>

</body>
</html>
