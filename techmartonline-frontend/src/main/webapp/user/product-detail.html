<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details - TechMart Online</title>
    <link rel="stylesheet" href="../css/tailwind.css" />
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
</head>
<body class="font-['Urbanist'] text-slate-800 bg-slate-50 antialiased min-h-screen flex flex-col justify-between">

<!-- Header Navigation -->
<nav class="bg-white border-b border-slate-100 sticky top-0 z-50 py-4 shadow-sm">
    <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
        <a href="../index.html" class="flex items-center gap-2 font-black text-2xl text-slate-900">
            <span class="bg-amber-400 text-slate-950 p-2 rounded-xl text-lg font-bold">🛒</span>
            TechMart
        </a>
        <div class="flex items-center gap-6 font-semibold text-sm">
            <a href="products.html" class="text-slate-600 hover:text-slate-900 transition-colors">Products</a>
            <a href="cart.html" class="text-slate-600 hover:text-slate-900 transition-colors">Cart</a>
            <a href="orders.html" class="text-slate-600 hover:text-slate-900 transition-colors">Orders</a>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="AuthUtils.logout()" class="px-4 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition-all cursor-pointer">Logout</button>
        </div>
    </div>
</nav>

<!-- Main Container -->
<main class="max-w-4xl mx-auto px-6 py-12 flex-grow w-full">
    <a href="products.html" class="inline-flex items-center gap-1.5 text-xs font-black text-amber-500 uppercase tracking-wider mb-6 hover:underline">
        ← Back to Catalog
    </a>

    <div id="productDetailContainer">
        <!-- Rendered dynamically -->
        <div class="text-center py-12">
            <span class="text-slate-400 font-semibold text-sm">Loading product details...</span>
        </div>
    </div>
</main>

<footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 w-full mt-auto">
    <div class="max-w-6xl mx-auto px-6 text-center text-xs font-semibold">
        © 2026 TechMart Online. All rights reserved.
    </div>
</footer>

<script src="../js/api/config.js"></script>
<script src="../js/utils/auth.js"></script>
<script src="../js/utils/helpers.js"></script>
<script src="../js/api/products.js"></script>
<script src="../js/pages/product-detail.js"></script>
<script>
    function addToCartDirect(id, name, price) {
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const existing = cart.find(x => x.id === id);
        
        const img = document.getElementById('mainDetailImage');
        const imageUrl = img ? img.src : '📦';

        if (existing) {
            existing.quantity += 1;
        } else {
            cart.push({ id, name, price, quantity: 1, image: imageUrl });
        }
        localStorage.setItem('cart', JSON.stringify(cart));
        alert('✅ Added to Cart!');
    }
</script>
</body>
</html>
