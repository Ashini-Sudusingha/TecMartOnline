<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - TechMart Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: "Plus Jakarta Sans", sans-serif !important;
            background-color: #f8fafc;
        }
        .premium-shadow {
            box-shadow: 0 10px 30px -3px rgba(148, 163, 184, 0.06), 0 4px 12px -2px rgba(148, 163, 184, 0.03);
        }
        .premium-card-shadow {
            box-shadow: 0 20px 40px -4px rgba(148, 163, 184, 0.08);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 antialiased custom-scrollbar min-h-screen flex flex-col justify-between">

<!-- Navigation Header -->
<nav class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50 py-4 shadow-sm">
    <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
        <!-- Logo -->
        <a href="../index.html" class="flex items-center gap-3 font-extrabold text-xl text-slate-900 tracking-tight">
            <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-amber-400 to-amber-300 text-slate-950 flex items-center justify-center font-bold text-lg shadow-md shadow-amber-500/10">
                <svg class="w-5 h-5 text-slate-950" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1,0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0,1-1.12-1.243l1.264-12A1.125 1.125 0 0,1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1,1-.75 0 .375.375 0 0,1 .75 0Zm7.5 0a.375.375 0 1,1-.75 0 .375.375 0 0,1 .75 0Z" />
                </svg>
            </div>
            TechMart
        </a>

        <!-- Navigation Links -->
        <div class="hidden md:flex items-center gap-8 font-semibold text-sm">
            <a href="products.html" class="text-amber-500 transition-colors">Shop Products</a>
            <a href="cart.html" class="text-slate-600 hover:text-slate-950 transition-colors flex items-center gap-1.5">
                Cart
                <span id="cartCountBadge" class="hidden px-2 py-0.5 text-[10px] font-bold rounded-full bg-amber-400 text-slate-950 animate-bounce">0</span>
            </a>
            <a href="profile.html" class="text-slate-600 hover:text-slate-950 transition-colors">My Profile</a>
        </div>

        <!-- Auth Actions / Dynamic Profile state wrapper -->
        <div class="flex items-center gap-3">
            <div id="authActionsContainer" class="flex items-center gap-2">
                <button onclick="handleLogout()" class="px-4 py-2 text-xs font-bold text-slate-700 bg-slate-50 hover:bg-slate-100 rounded-xl transition-all border border-slate-200/60 cursor-pointer">
                    Logout
                </button>
            </div>
        </div>
    </div>
</nav>

<!-- Main Container -->
<main class="max-w-6xl mx-auto px-6 py-12 flex-grow w-full space-y-8">
    
    <!-- Page Header -->
    <div class="flex flex-col gap-1 text-left">
        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Ecosystem Catalog</h2>
        <p class="text-xs text-slate-400 font-bold uppercase tracking-wider">High-fidelity devices, audio systems, and pristine accessories</p>
    </div>

    <!-- Filters Section -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-center bg-white p-4 rounded-3xl border border-slate-100 shadow-sm">
        <!-- Search bar -->
        <div class="relative col-span-1 md:col-span-2">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                </svg>
            </span>
            <input type="text" id="searchInput" placeholder="Search catalog items..." class="w-full pl-10 pr-4 py-2.5 text-xs font-semibold rounded-2xl border border-slate-100 bg-slate-50/50 focus:bg-white focus:border-amber-400 focus:outline-none transition-all placeholder:text-slate-400" />
        </div>

        <!-- Filter options -->
        <div class="col-span-1">
            <select id="categoryFilter" class="w-full px-4 py-2.5 text-xs font-bold bg-slate-50/50 border border-slate-100 focus:border-amber-400 focus:bg-white rounded-2xl focus:outline-none cursor-pointer transition-all">
                <option value="all">All Categories</option>
                <option value="Laptops & Devices">Laptops & Devices</option>
                <option value="Audio Systems">Audio Systems</option>
                <option value="Monitor Displays">Monitor Displays</option>
                <option value="Accessories">Accessories</option>
            </select>
        </div>

        <div class="col-span-1">
            <select id="sortFilter" class="w-full px-4 py-2.5 text-xs font-bold bg-slate-50/50 border border-slate-100 focus:border-amber-400 focus:bg-white rounded-2xl focus:outline-none cursor-pointer transition-all">
                <option value="default">Sort by: Default</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="name">Name: A to Z</option>
            </select>
        </div>
    </div>

    <!-- Content Section -->
    <div class="space-y-6">
        <div class="flex items-center justify-between px-2">
            <span id="resultsCount" class="text-xs font-bold text-slate-400 uppercase tracking-wider text-left">Showing 0 products</span>
        </div>

        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Rendered Dynamically -->
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="text-center py-12">
            <svg class="animate-spin h-8 w-8 text-amber-500 mx-auto" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-xs font-semibold text-slate-400 mt-3">Loading catalog assets...</p>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16 bg-white rounded-3xl border border-slate-100 shadow-sm space-y-4">
            <div class="h-12 w-12 rounded-2xl bg-amber-400/10 text-amber-500 flex items-center justify-center mx-auto">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                </svg>
            </div>
            <div>
                <h3 class="font-bold text-slate-700 text-sm">No products found</h3>
                <p class="text-xs text-slate-400 mt-1">Adjust your search parameters or select a different category.</p>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="bg-white border-t border-slate-100 py-8 w-full mt-auto">
    <div class="max-w-6xl mx-auto px-6 text-center text-xs font-semibold text-slate-400">
        © 2026 TechMart Online. All rights reserved.
    </div>
</footer>

<!-- Scripts -->
<script src="../js/api/config.js"></script>
<script src="../js/utils/auth.js"></script>
<script src="../js/utils/helpers.js"></script>
<script src="../js/api/products.js"></script>
<script src="../js/pages/products.js"></script>

<script>
    function handleLogout() {
        AuthUtils.logout();
        window.location.href = "../index.html";
    }
</script>
</body>
</html>
