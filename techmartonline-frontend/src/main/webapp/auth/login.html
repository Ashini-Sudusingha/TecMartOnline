<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - TechMart Online</title>
    <link rel="stylesheet" href="../css/tailwind.css" />
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <!-- External CSS -->
    <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>

<div class="auth-card">
    <!-- Back Button -->
    <a href="../index.html" class="back-home">← Back to Home</a>

    <!-- Header -->
    <h1>Welcome Back 👋</h1>
    <p class="subtitle">Login to your TechMart account</p>

    <!-- Login Form -->
    <form id="loginForm" autocomplete="off">
        <!-- Email -->
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="your@email.com" required />
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required minlength="6" />
        </div>

        <!-- Error & Success Messages -->
        <div id="errorMessage" class="error-message">⚠️ Invalid email or password. Please try again.</div>
        <div id="successMessage" class="success-message">✅ Login successful! Redirecting...</div>

        <!-- Submit -->
        <button type="submit" id="loginBtn" class="btn-auth">Sign In →</button>

        <!-- Register Link -->
        <p class="auth-link">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </p>
    </form>
</div>

<!-- External JavaScript -->
<script src="../js/api/config.js"></script>
<script src="../js/api/auth.js"></script>
<script src="../js/utils/helpers.js"></script>
<script src="../js/pages/login.js"></script>

</body>
</html>
