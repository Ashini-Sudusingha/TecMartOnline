<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - TechMart Online</title>
    <link rel="stylesheet" href="../css/tailwind.css" />
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <!-- External CSS -->
    <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>

<div class="auth-card signup-card">
    <!-- Back Button -->
    <a href="../index.html" class="back-home">← Back to Home</a>

    <!-- Header -->
    <h1>Create Account 🚀</h1>
    <p class="subtitle">Join TechMart and start shopping</p>

    <!-- Signup Form -->
    <form id="signupForm" autocomplete="off">
        <!-- First Name + Last Name Row -->
        <div class="form-row">
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" placeholder="John" required />
            </div>
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" placeholder="Doe" required />
            </div>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="your@email.com" required />
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a password" required minlength="6" />
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password" required minlength="6" />
        </div>

        <!-- Mobile (Optional) -->
        <div class="form-group">
            <label for="mobile">Mobile Number (Optional)</label>
            <input type="tel" id="mobile" placeholder="077 123 4567" />
        </div>

        <!-- Error & Success Messages -->
        <div id="errorMessage" class="error-message">⚠️ Please fix the errors above.</div>
        <div id="successMessage" class="success-message">✅ Account created! Redirecting to login...</div>

        <!-- Submit -->
        <button type="submit" id="signupBtn" class="btn-auth">Create Account →</button>

        <!-- Login Link -->
        <p class="auth-link">
            Already have an account? <a href="login.html">Sign In</a>
        </p>
    </form>
</div>

<!-- External JavaScript -->
<script src="../js/api/config.js"></script>
<script src="../js/api/auth.js"></script>
<script src="../js/utils/helpers.js"></script>
<script src="../js/pages/signup.js"></script>

</body>
</html>
